[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "take-home-router"
version = "1.1.0"
description = "Standalone calibrated model router extracted from TrustRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Medha" }]
dependencies = [
  "fastapi>=0.116,<0.117",
  "lightgbm>=4.6,<5",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<0.36",
]

[project.scripts]
take-home-router = "take_home_router.cli:entrypoint"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.403",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/take_home_router"]

[tool.hatch.build.targets.wheel.force-include]
"artifacts" = "take_home_router/artifacts"
"config" = "take_home_router/config"

[tool.hatch.build.targets.sdist]
include = [
  "/artifacts",
  "/config",
  "/evidence",
  "/examples",
  "/src",
  "/tests",
  "/Dockerfile",
  "/LICENSE",
  "/Makefile",
  "/README.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
