name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run quality gate
        run: make check

      - name: Build distributions
        run: uv build

      - name: Build container
        run: docker build --tag take-home-router:ci .

      - name: Smoke-test non-root container
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id take-home-router:ci -u)" = "10001"
          docker run --rm --detach --name take-home-router-ci --publish 8000:8000 take-home-router:ci
          trap 'docker stop take-home-router-ci' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              break
            fi
            test "$attempt" -lt 40
            sleep 0.5
          done
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data '{"prompt":"CI container smoke test"}' \
            http://127.0.0.1:8000/v1/route \
            | python -c 'import json, sys; assert json.load(sys.stdin)["selected_model"]'
